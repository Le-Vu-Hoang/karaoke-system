upstream backend_api {
    server backend:3001;
}

upstream customer_app {
    server ktv_cus:3000;
}

upstream manager_app {
    server ktv_manager:3002;
}

# -----------------------------------------------
# Customer-facing site (default on port 80)
# -----------------------------------------------
server {
    listen 80;
    server_name localhost;

    client_max_body_size 10M;

    # API proxy
    location /api/ {
        proxy_pass         http://backend_api;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket proxy (Socket.IO)
    location /socket.io/ {
        proxy_pass         http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # Customer frontend (default)
    location / {
        proxy_pass         http://customer_app;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# -----------------------------------------------
# Manager portal (port 8080)
# -----------------------------------------------
server {
    listen 8080;
    server_name localhost;

    client_max_body_size 10M;

    # API proxy
    location /api/ {
        proxy_pass         http://backend_api;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy
    location /socket.io/ {
        proxy_pass         http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # Manager frontend
    location / {
        proxy_pass         http://manager_app;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
