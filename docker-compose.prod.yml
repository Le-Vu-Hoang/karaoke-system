# ==============================================
# K-Master Production — Docker Compose
# ==============================================
# Usage:
#   1. cp .env.production.example .env.production
#   2. Fill in real values in .env.production
#   3. docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# ==============================================

name: ktv_production

services:
  # ------------------------------------------
  # Infrastructure
  # ------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: ktv_prod_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ktv-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: ktv_prod_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_prod_data:/data
    restart: unless-stopped
    networks:
      - ktv-prod
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=${REDIS_PASSWORD} redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD}"
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru

  # ------------------------------------------
  # Backend API
  # ------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ktv_prod_backend
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3001}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      VNPAY_TERMINAL_ID: ${VNPAY_TERMINAL_ID}
      VNPAY_SECRET_KEY: ${VNPAY_SECRET_KEY}
      VNPAY_URL: ${VNPAY_URL}
      VNPAY_API: ${VNPAY_API}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY}
      MOMO_API_ENDPOINT: ${MOMO_API_ENDPOINT}
      MOMO_REDIRECT_URL: ${MOMO_REDIRECT_URL}
      MOMO_IPN_URL: ${MOMO_IPN_URL}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      FACEBOOK_CALLBACK_URL: ${FACEBOOK_CALLBACK_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ktv-prod
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/v1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ------------------------------------------
  # Customer Frontend
  # ------------------------------------------
  ktv_cus:
    build:
      context: .
      dockerfile: ktv_cus/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
    container_name: ktv_prod_customer
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ktv-prod

  # ------------------------------------------
  # Manager Frontend
  # ------------------------------------------
  ktv_manager:
    build:
      context: .
      dockerfile: ktv_manager/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_MANAGER_BACKEND_URL}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
    container_name: ktv_prod_manager
    environment:
      NODE_ENV: production
      PORT: 3002
      HOSTNAME: "0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ktv-prod

  # ------------------------------------------
  # Nginx Reverse Proxy
  # ------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: ktv_prod_nginx
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - ktv_cus
      - ktv_manager
    restart: unless-stopped
    networks:
      - ktv-prod

networks:
  ktv-prod:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
